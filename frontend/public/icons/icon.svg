<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="104" fill="#0f172a" />
  <rect x="16" y="16" width="480" height="480" rx="88" stroke="#0ea5e9" stroke-width="8" stroke-opacity="0.4" />
  
  <!-- Símbolo Industrial SGMS: Sopradora / Matriz -->
  <g transform="translate(106, 96)">
    <!-- Molde externo -->
    <path d="M40 80 H260 V260 C260 290 236 320 200 320 H100 C64 320 40 290 40 260 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="12" stroke-linejoin="round" />
    <!-- Gargalo da garrafa / bico de sopro -->
    <rect x="120" y="20" width="60" height="60" rx="8" fill="#0284c7" stroke="#38bdf8" stroke-width="10" />
    <line x1="100" y1="20" x2="200" y2="20" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" />
    
    <!-- Linhas de ar sob pressão (Sopro) -->
    <path d="M150 90 V240" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" stroke-dasharray="16 12" />
    <path d="M110 130 C110 200 130 250 130 250" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round" opacity="0.7" />
    <path d="M190 130 C190 200 170 250 170 250" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round" opacity="0.7" />
    
    <!-- Tipografia SGMS -->
    <text x="150" y="380" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#f8fafc" letter-spacing="4">SGMS</text>
  </g>
</svg>
